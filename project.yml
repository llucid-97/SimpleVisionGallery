name: SimpleVisionGallery
options:
  bundleIdPrefix: com.llucid
  deploymentTarget:
    visionOS: "26.1"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SimpleVisionGallery:
    type: application
    platform: visionOS
    sources:
      - path: SimpleVisionGallery
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llucid.simplevisiongallery
        PRODUCT_NAME: SimpleVisionGallery
        INFOPLIST_FILE: SimpleVisionGallery/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.14"
        CURRENT_PROJECT_VERSION: "1.0.14"
        TARGETED_DEVICE_FAMILY: "7"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: GalleryShareExtension
  GalleryShareExtension:
    type: app-extension
    platform: visionOS
    sources:
      - path: GalleryShareExtension
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llucid.simplevisiongallery.share
        PRODUCT_NAME: GalleryShareExtension
        INFOPLIST_FILE: GalleryShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.14"
        CURRENT_PROJECT_VERSION: "1.0.14"
        TARGETED_DEVICE_FAMILY: "7"
schemes:
  SimpleVisionGallery:
    build:
      targets:
        SimpleVisionGallery: all
    run:
      config: Debug
    archive:
      config: Release
